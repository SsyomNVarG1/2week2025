<html>
  <head>
    <title>trabajando con checkbox</title>
  </head>
  <body>
    <form action="./02_ej0002.php" method="POST">
      ingrese un valor
      <input
        type="number"
        name="valor1"
        id="valor1"
        min="0"
        autocomplete="off"
        required
      /><br />

      ingrese un segundo valor
      <input
        type="number"
        name="valor2"
        id="valor2"
        min="0"
        autocomplete="off"
        required
      /><br /><br /><br />

      <input type="checkbox" name="check1" value="suma" checked />sumar <br />

      <input type="checkbox" name="check2" value="resta" />restar <br />

      <input type="submit" value="Realizar" />
    </form>
  </body>
</html>
